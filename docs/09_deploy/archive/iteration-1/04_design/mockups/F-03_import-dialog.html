<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>事務HUB - データ復元(モックアップ v0.9)</title>
<style>
    :root {
      --color-white: #FFFFFF;
      --color-bg: #F2F2F4;
      --color-border: #D1D1D6;
      --color-text-secondary: #6E6E73;
      --color-text: #3A3A3C;
      --color-red: #B3453A;
      --radius-window: 10px;
      --radius-button: 6px;
      --radius-badge: 999px;
      --control-height: 32px;
      --header-height: 56px;
      --shadow-window: 0 20px 60px rgba(0,0,0,0.28);
      --shadow-modal: 0 12px 40px rgba(0,0,0,0.35);
      --font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #DCDCE0; /* 例外: 見本を框で囲むための外側の背景(実アプリには存在しない) */
      font-family: var(--font-family);
      color: var(--color-text);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    .window {
      width: 1280px;
      min-height: 560px; /* ダイアログ全体+上下余白がウィンドウ内に収まる高さを確保 */
      margin: 24px auto;
      background: var(--color-bg);
      border-radius: var(--radius-window); /* 例外: ウィンドウ外枠はOS表現として角丸を維持 */
      overflow: hidden;
      box-shadow: var(--shadow-window);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .titlebar {
      height: 38px;
      min-height: 38px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }
    .traffic-lights { display: flex; gap: 8px; }
    .traffic-light { width: 12px; height: 12px; border-radius: 50%; } /* 例外: OS標準の信号ボタン */
    .tl-close { background: #FF5F57; }
    .tl-min { background: #FFBD2E; }
    .tl-zoom { background: #28C840; }
    .titlebar-title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-right: 56px;
    }
    .app-body { display: flex; flex: 1; min-height: 0; }
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--color-bg);
      border-right: 1px solid var(--color-border);
      padding: 0;
    }
    .sidebar-header {
      height: var(--header-height);
      box-sizing: border-box;
      display: flex; align-items: center;
      padding: 0 18px;
      font-size: 18px; font-weight: 600; color: var(--color-text);
      background: var(--color-white);
      border-bottom: 1px solid var(--color-border);
    }
    .sidebar-nav { list-style: none; margin: 0; padding: 0; }
    .sidebar-item {
      padding: 7px 18px;
      margin-bottom: 2px;
      border-radius: 0;
      font-size: 13px;
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-item.active { background: var(--color-text); color: var(--color-white); font-weight: 600; }
    .sidebar-item.disabled { color: var(--color-text-secondary); }
    .sidebar-item.active .badge-soon { display: none; }
    .sidebar-item .badge-soon { background: var(--color-white); color: var(--color-text-secondary); }
    /* バッジ(表示だけの物): 丸型(例外) */
    .badge { display: inline-block; border-radius: var(--radius-badge); padding: 3px 10px; font-size: 11px; white-space: nowrap; }
    .badge-soon { background: var(--color-bg); color: var(--color-text-secondary); }
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: auto;
      background: var(--color-bg);
      filter: blur(1.5px);
      opacity: 0.6;
    }
    .page-header {
      height: var(--header-height);
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; background: var(--color-white); border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .page-title { font-size: 18px; font-weight: 600; margin: 0; color: var(--color-text); }
    .page-content { padding: 24px 28px; flex: 1; }

    /* ボタン(押せる物): 角丸6px・高さ32px */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: var(--control-height); padding: 0 16px;
      border-radius: var(--radius-button);
      border: 1px solid transparent;
      font-family: inherit; font-size: 13px; font-weight: 500;
      white-space: nowrap;
    }
    .btn-primary { background: var(--color-text); border-color: var(--color-text); color: var(--color-white); }
    .btn-secondary { background: var(--color-white); border-color: var(--color-border); color: var(--color-text); }
    .btn-danger { background: var(--color-red); border-color: var(--color-red); color: var(--color-white); }

    /* 入れ物(パネル・カード): 角丸なし、影なし */
    .summary-card { width: 280px; background: var(--color-white); border: 1px solid var(--color-border); padding: 24px; text-align: center; }
    .summary-value { font-size: 32px; font-weight: 700; color: var(--color-text); }
    .summary-label { font-size: 12px; color: var(--color-text-secondary); margin-top: 6px; }
    .data-menu { display: flex; align-items: center; gap: 8px; }
    .data-menu-label { font-size: 11px; color: var(--color-text-secondary); margin-right: 4px; }

    /* オーバーレイ・ダイアログ */
    .overlay { position: absolute; inset: 38px 0 0 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; }
    .modal { width: 440px; background: var(--color-white); border: 1px solid var(--color-border); box-shadow: var(--shadow-modal); padding: 22px 24px; position: relative; }
    .modal h2 { font-size: 15px; margin: 0 0 12px; color: var(--color-text); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-close { position: absolute; top: 12px; right: 14px; font-size: 14px; color: var(--color-text-secondary); }

    .reference-block { margin-top: 20px; }
    .reference-label { display: inline-block; font-size: 11px; color: var(--color-white); background: var(--color-text); padding: 2px 8px; margin-bottom: 8px; }

    /* メッセージ(読むだけの物): 角丸なし、枠(外周)なし、左4pxの帯。警告もエラーと同じ扱い(赤帯+!) */
    .message { display: flex; align-items: flex-start; gap: 10px; background: var(--color-white); border-left: 4px solid; padding: 10px 14px; font-size: 12px; color: var(--color-text); margin-bottom: 16px; }
    .message-success { border-left-color: var(--color-text); }
    .message-error, .message-warning { border-left-color: var(--color-red); }
    .message-icon { font-weight: 700; flex-shrink: 0; line-height: 1.5; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic-lights">
        <div class="traffic-light tl-close"></div>
        <div class="traffic-light tl-min"></div>
        <div class="traffic-light tl-zoom"></div>
      </div>
      <div class="titlebar-title">事務HUB - ホーム</div>
    </div>
    <div class="app-body">
      <div class="sidebar">
        <div class="sidebar-header">事務HUB</div>
        <ul class="sidebar-nav">
          <li class="sidebar-item active"><span>ホーム</span></li>
          <li class="sidebar-item"><span>取引先管理</span></li>
          <li class="sidebar-item disabled"><span>案件管理</span><span class="badge badge-soon">準備中</span></li>
          <li class="sidebar-item"><span>見積書・請求書</span></li>
          <li class="sidebar-item disabled"><span>入出金・経費</span><span class="badge badge-soon">準備中</span></li>
          <li class="sidebar-item disabled"><span>タスク・期限</span><span class="badge badge-soon">準備中</span></li>
        </ul>
      </div>
      <div class="main">
        <div class="page-header">
          <h1 class="page-title">ホーム</h1>
          <div class="data-menu">
            <span class="data-menu-label">データ管理</span>
            <button class="btn btn-secondary">データをエクスポート</button>
            <button class="btn btn-secondary">データを復元</button>
            <button class="btn btn-secondary">自社情報・振込先の設定</button>
          </div>
        </div>
        <div class="page-content">
          <div class="summary-card">
            <div class="summary-value">12件</div>
            <div class="summary-label">取引先登録件数(利用中)</div>
          </div>
        </div>
      </div>
      <div class="overlay">
        <div class="modal">
          <span class="modal-close">&times;</span>
          <h2>データを復元</h2>
          <div class="message message-warning">
            <span class="message-icon">!</span>
            <span>現在のデータ(取引先・自社情報・見積書・請求書等)がエクスポートファイルの内容で置き換わります。この操作は元に戻せません(実行前に現在のデータは自動的に退避されます)。</span>
          </div>
          <div class="modal-actions">
            <button class="btn btn-danger">ファイルを選択して復元</button>
          </div>

          <div class="reference-block">
            <div class="reference-label">参考: 復元成功時の完了メッセージ</div>
            <div class="message message-success">
              <span class="message-icon">&#10003;</span>
              <span>12件のデータを復元しました。</span>
            </div>
            <div class="reference-label">参考: 復元失敗時のエラーメッセージ</div>
            <div class="message message-error">
              <span class="message-icon">!</span>
              <span>復元に失敗しました。データは復元前の状態に戻しました。</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
