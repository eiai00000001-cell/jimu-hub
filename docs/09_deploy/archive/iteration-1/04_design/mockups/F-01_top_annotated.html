<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>事務HUB - ホーム(操作説明用注釈版)</title>
<style>
    :root {
      --color-white: #FFFFFF;
      --color-bg: #F2F2F4;
      --color-border: #D1D1D6;
      --color-text-secondary: #6E6E73;
      --color-text: #3A3A3C;
      --color-red: #B3453A;
      --radius-window: 10px;
      --radius-button: 6px;
      --radius-badge: 999px;
      --control-height: 32px;
      --header-height: 56px;
      --shadow-window: 0 20px 60px rgba(0,0,0,0.28);
      --font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #DCDCE0; /* 例外: 見本を框で囲むための外側の背景(実アプリには存在しない) */
      font-family: var(--font-family);
      color: var(--color-text);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    .window {
      width: 1280px;
      margin: 24px auto;
      background: var(--color-bg);
      border-radius: var(--radius-window); /* 例外: ウィンドウ外枠はOS表現として角丸を維持 */
      overflow: hidden;
      box-shadow: var(--shadow-window);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .titlebar {
      height: 38px;
      min-height: 38px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }
    .traffic-lights { display: flex; gap: 8px; }
    .traffic-light { width: 12px; height: 12px; border-radius: 50%; } /* 例外: OS標準の信号ボタン */
    .tl-close { background: #FF5F57; }
    .tl-min { background: #FFBD2E; }
    .tl-zoom { background: #28C840; }
    .titlebar-title {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-right: 56px;
    }
    .app-body { display: flex; flex: 1; min-height: 0; }
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--color-bg);
      border-right: 1px solid var(--color-border);
      padding: 0;
    }
    .sidebar-header {
      height: var(--header-height);
      box-sizing: border-box;
      display: flex; align-items: center;
      padding: 0 18px;
      font-size: 18px; font-weight: 600; color: var(--color-text);
      background: var(--color-white);
      border-bottom: 1px solid var(--color-border);
    }
    .sidebar-nav { list-style: none; margin: 0; padding: 0; }
    .sidebar-item {
      padding: 7px 18px;
      margin-bottom: 2px;
      border-radius: 0; /* 角丸は「押せる物」のみ。サイドバー項目は直角 */
      font-size: 13px;
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-item.active { background: var(--color-text); color: var(--color-white); font-weight: 600; }
    .sidebar-item.disabled { color: var(--color-text-secondary); }
    .sidebar-item.active .badge-soon { display: none; }
    /* サイドバーは地が背景グレーのため、準備中バッジのみ白地にして視認性を確保する */
    .sidebar-item .badge-soon { background: var(--color-white); color: var(--color-text-secondary); }
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: auto;
      background: var(--color-bg);
    }
    .page-header {
      height: var(--header-height);
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; background: var(--color-white); border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .page-title { font-size: 18px; font-weight: 600; margin: 0; color: var(--color-text); }
    .page-content { padding: 24px 28px; flex: 1; }

    /* ボタン(押せる物): 角丸6px・高さ32px */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: var(--control-height); padding: 0 16px;
      border-radius: var(--radius-button);
      border: 1px solid transparent;
      font-family: inherit; font-size: 13px; font-weight: 500;
      white-space: nowrap;
    }
    .btn-primary { background: var(--color-text); border-color: var(--color-text); color: var(--color-white); }
    .btn-secondary { background: var(--color-white); border-color: var(--color-border); color: var(--color-text); }

    /* バッジ(表示だけの物): 丸型(例外) */
    .badge { display: inline-block; border-radius: var(--radius-badge); padding: 3px 10px; font-size: 11px; white-space: nowrap; }
    .badge-soon { background: var(--color-bg); color: var(--color-text-secondary); }

    /* 入れ物(パネル・カード): 角丸なし、影なし */
    .summary-card { width: 280px; background: var(--color-white); border: 1px solid var(--color-border); padding: 24px; text-align: center; }
    .summary-value { font-size: 32px; font-weight: 700; color: var(--color-text); }
    .summary-label { font-size: 12px; color: var(--color-text-secondary); margin-top: 6px; }
    .section-note { font-size: 12px; color: var(--color-text-secondary); margin-top: 24px; max-width: 480px; line-height: 1.7; }
    .data-menu { display: flex; align-items: center; gap: 8px; }
    .data-menu-label { font-size: 11px; color: var(--color-text-secondary); margin-right: 4px; }

    /* 操作説明用の注釈バッジ(納品マニュアル向け。実アプリには存在しない) */
    .annot-target { position: relative; }
    .annot-inline { position: relative; display: inline-block; }
    .annot-badge {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--color-text);
      color: var(--color-white);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--color-white);
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
      z-index: 100;
      font-family: var(--font-family);
    }
    /* 注釈バッジ(行内配置版): サイドバー等、テキストが箱の端から始まる要素はウィンドウ外へのはみ出しを避けるため
       絶対配置ではなく通常のフロー内(テキストの直前)に配置する */
    .annot-badge-flow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      border-radius: 999px;
      background: var(--color-text);
      color: var(--color-white);
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-family);
      vertical-align: middle;
    }
    .sidebar-item .annot-label-group { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic-lights">
        <div class="traffic-light tl-close"></div>
        <div class="traffic-light tl-min"></div>
        <div class="traffic-light tl-zoom"></div>
      </div>
      <div class="titlebar-title">事務HUB - ホーム</div>
    </div>
    <div class="app-body">
      <div class="sidebar">
        <div class="sidebar-header">事務HUB</div>
        <ul class="sidebar-nav">
          <li class="sidebar-item active"><span>ホーム</span></li>
          <li class="sidebar-item">
            <span class="annot-label-group"><span class="annot-badge-flow">1</span><span>取引先管理</span></span>
          </li>
          <li class="sidebar-item disabled">
            <span class="annot-label-group"><span class="annot-badge-flow">2</span><span>案件管理</span></span>
            <span class="badge badge-soon">準備中</span>
          </li>
          <li class="sidebar-item disabled"><span>見積書・請求書</span><span class="badge badge-soon">準備中</span></li>
          <li class="sidebar-item disabled"><span>入出金・経費</span><span class="badge badge-soon">準備中</span></li>
          <li class="sidebar-item disabled"><span>タスク・期限</span><span class="badge badge-soon">準備中</span></li>
        </ul>
      </div>
      <div class="main">
        <div class="page-header">
          <h1 class="page-title">ホーム</h1>
          <div class="data-menu">
            <span class="data-menu-label">データ管理</span>
            <span class="annot-inline"><span class="annot-badge">3</span><button class="btn btn-secondary">データをエクスポート</button></span>
            <span class="annot-inline"><span class="annot-badge">4</span><button class="btn btn-secondary">データを復元</button></span>
          </div>
        </div>
        <div class="page-content">
          <div class="summary-card">
            <div class="summary-value">12件</div>
            <div class="summary-label">取引先登録件数(利用中)</div>
          </div>
          <p class="section-note">
            左のサイドメニューから機能を選択してください。「準備中」の項目は、以降のイテレーションで順次利用可能になります。
          </p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
